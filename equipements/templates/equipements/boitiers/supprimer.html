{% extends 'equipements/base.html' %}

{% block title %}Supprimer un boîtier{% endblock %}

{% block content %}
<a href="/boitiers/" class="retour">← Retour à la liste</a>
<h2>Supprimer le boîtier {{ boitier.numero_serie }}</h2>
<p>Es-tu sûre de vouloir supprimer ce boîtier ? Cette action est irréversible.</p>
<form method="POST">
    {% csrf_token %}
    <button type="submit" class="btn" style="background-color: red;">Confirmer la suppression</button>
    <a href="/boitiers/" class="btn" style="background-color: gray; margin-left: 10px;">Annuler</a>
</form>
{% endblock %}
